<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<!-- 页面含孩子照片与家庭住址：明确拒绝搜索引擎/爬虫收录 -->
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2F0E7">
<title>叶一珵 · 十岁生日邀请函</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body[data-theme="a"]{
    --bg:#FFF7EC; --bg2:#FFEFDC;
    --ink:#2C2A33; --sub:#8C8590; --body:#5A5460;
    --primary:#FF6B4A; --accent:#2E9BE6; --extra:#FFC24B;
    --card:#FFFFFF; --line:rgba(44,42,51,.06);
    --shadow:0 10px 30px rgba(155,89,61,.14);
    --title-font:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --title-weight:900; --title-size:27px; --title-track:.16em; --title-color:var(--primary);
    --name-font:var(--title-font); --name-weight:900;
    --name-size:36px; --name-track:.04em; --name-color:var(--ink);
    --photo-radius:44px; --photo-inner-radius:32px; --photo-width:100%;
    --map-base:#EDF4E9;   /* 真实地图缩略图的兜底底色（图片加载前露出的颜色） */
    --map-pin:#FF6B4A;
    --pill-bg:#2C2A33; --pill-fg:#FFFFFF; --pill-border:transparent;
    --letter-align:center; --letter-indent:0; --letter-color:var(--body);
    --card-radius:22px; --card-bg:var(--card); --card-shadow:var(--shadow); --card-border:1px solid var(--line);
}
  body[data-theme="b"]{
    --bg:#F2F0E7; --bg2:#EAE6D9;
    --ink:#34433A; --sub:#7E8A78; --body:#4F5F4B;
    --primary:#A9704A; --accent:#8FA98B; --extra:#C6D2C0;
    --card:#FFFFFF; --line:rgba(52,67,58,.14);
    --shadow:0 10px 28px rgba(52,67,58,.13);
    --title-font:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
    --title-weight:600; --title-size:27px; --title-track:.16em; --title-color:var(--primary);
    --name-font:var(--title-font); --name-weight:600;
    --name-size:36px; --name-track:.08em; --name-color:var(--ink);
    --photo-radius:20px; --photo-inner-radius:12px; --photo-width:100%;
    --map-base:#EFEAD9;   /* 与高德底图的米色调接近，图片加载前不会有跳色 */
    --map-pin:#6F8C63;
    --pill-bg:transparent; --pill-fg:#5F7A55; --pill-border:rgba(143,169,139,.9);
    --letter-align:left; --letter-indent:2em; --letter-color:var(--body);
    --card-radius:0px; --card-bg:transparent; --card-shadow:none; --card-border:none;
}
  body[data-theme="c"]{
    --bg:#0B1533; --bg2:#1B2450;
    --ink:#FFFFFF; --sub:#A8B4D8; --body:#C7D0EA;
    --primary:#F5C453; --accent:#5FD4F0; --extra:#31427A;
    --card:rgba(22,32,63,.92); --line:rgba(95,212,240,.28);
    --shadow:0 14px 34px rgba(0,0,0,.45);
    --title-font:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --title-weight:700; --title-size:22px; --title-track:.18em; --title-color:var(--accent);
    --name-font:var(--title-font); --name-weight:800;
    --name-size:33px; --name-track:.06em; --name-color:#FFFFFF;
    --photo-radius:50%; --photo-inner-radius:50%; --photo-width:74%;
    --map-base:#EFEAD9;   /* 三套主题共用同一张高德底图，底色统一 */
    --map-pin:#F5C453;
    --pill-bg:#F5C453; --pill-fg:#0B1533; --pill-border:transparent;
    --letter-align:center; --letter-indent:0; --letter-color:var(--body);
    --card-radius:24px; --card-bg:var(--card); --card-shadow:var(--shadow);
    --card-border:1.5px solid var(--line);
}
  /* ---------- 页面容器 ---------- */
  .page{
    position:relative;width:100%;max-width:420px;min-height:100vh;
    padding:26px 20px 34px;overflow:hidden;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    display:flex;flex-direction:column;align-items:center;gap:18px;
  }

  /* ---------- 装饰 ---------- */
  .deco-top,.deco-bottom{width:100%;height:auto;display:block}
  .stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
  body[data-theme="c"] .stars{display:block}
  body[data-theme="c"] .deco-top{display:none}
  .deco-top,.deco-bottom,.stars,.anim{opacity:0;animation:fadeIn .9s .1s forwards}
  .anim{animation:fadeUp .7s cubic-bezier(.22,.8,.3,1) forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}
  .d4{animation-delay:.40s}.d5{animation-delay:.52s}.d6{animation-delay:.64s}.d7{animation-delay:.76s}

  /* ---------- 标题区 ---------- */
  .head{width:100%;display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center}
  .eyebrow{font-size:11.5px;letter-spacing:.22em;font-weight:600;color:var(--primary);text-transform:uppercase}
  body[data-theme="c"] .eyebrow{color:var(--accent)}
  .big-num{display:none;font-weight:900;font-size:92px;line-height:1;color:var(--primary);
    font-family:-apple-system,"SF Pro Display",sans-serif;letter-spacing:-.02em}
  body[data-theme="c"] .big-num{display:block}
  /* 姓名 + 事由 是一组，内部收紧，与 eyebrow / subtitle 之间留白更大 */
  .hero{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px}
  .name{font-family:var(--name-font);font-weight:var(--name-weight);
    font-size:var(--name-size);line-height:1.1;letter-spacing:var(--name-track);color:var(--name-color)}
  .title{font-family:var(--title-font);font-weight:var(--title-weight);
    font-size:var(--title-size);line-height:1.2;letter-spacing:var(--title-track);color:var(--title-color)}
  .subtitle{font-size:14.5px;line-height:1.55;color:var(--sub)}

  /* ---------- 照片 ---------- */
  .photo-card{
    width:var(--photo-width);padding:6px;background:var(--card);
    border-radius:var(--photo-radius);box-shadow:var(--shadow);border:1px solid var(--line);
  }
  body[data-theme="b"] .photo-card{padding:0;overflow:hidden}
  body[data-theme="c"] .photo-card{
    padding:9px;background:transparent;border:2px solid var(--accent);
    box-shadow:0 0 32px rgba(95,212,240,.28);
  }
  .photo-card img{display:block;width:100%;aspect-ratio:646/432;object-fit:cover;
    border-radius:var(--photo-inner-radius)}
  body[data-theme="c"] .photo-card img{aspect-ratio:1}

  /* ---------- 邀请文案 ---------- */
  .letter{width:100%;display:flex;flex-direction:column;gap:0;
    text-align:var(--letter-align);font-size:15.5px;line-height:1.9;
    color:var(--letter-color);letter-spacing:.01em}
  .letter .salut{font-weight:600;color:var(--ink);margin-bottom:5px}
  .letter .ln{display:block;text-indent:var(--letter-indent)}
  body[data-theme="b"] .letter{font-family:"Songti SC","Noto Serif SC",serif;font-size:15.5px;line-height:2.05}


  /* ---------- 信息卡 ---------- */
  .info{width:100%;display:flex;flex-direction:column;gap:12px}
  body[data-theme="b"] .info{gap:0}
  .info-card{
    display:flex;align-items:center;gap:14px;padding:16px 18px;
    background:var(--card-bg);border-radius:var(--card-radius);
    box-shadow:var(--card-shadow);border:var(--card-border);
  }
  body[data-theme="b"] .info-card{
    border-bottom:1px solid var(--line);padding:15px 2px;
    border-top:none;border-left:none;border-right:none;border-radius:0;
  }
  body[data-theme="b"] .info-card:first-child{border-top:1px solid var(--line)}
  .info-card .ico{width:22px;height:22px;flex:0 0 22px;color:var(--primary)}
  .info-card .ico svg{width:100%;height:100%;display:block}
  .info-card .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .info-card .k{font-size:11.5px;letter-spacing:.14em;color:var(--primary);font-weight:600}
  .info-card .v{font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  .info-card .slots{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .info-card .slot{
    font-style:normal;font-size:13px;font-weight:700;letter-spacing:.02em;
    color:var(--primary);padding:3px 11px;border-radius:999px;
    background:var(--bg);border:1px solid var(--line);
  }
  body[data-theme="b"] .info-card .slot{background:#FFFFFF;border-color:rgba(52,67,58,.12)}
  body[data-theme="c"] .info-card .slot{background:rgba(11,21,51,.75)}

  /* ---------- 地图卡（点击跳地图） ---------- */
  .map-card{
    position:relative;display:block;width:100%;height:134px;border-radius:22px;
    overflow:hidden;text-decoration:none;box-shadow:var(--shadow);
    border:1px solid var(--line);transition:transform .18s ease;
  }
  body[data-theme="b"] .map-card{border-radius:16px}
  .map-card:active{transform:scale(.985)}
  .map-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    display:block;background:var(--map-base)}
  .map-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .map-svg .m-pin{fill:var(--map-pin);stroke:#FFFFFF;stroke-width:1.4;
    paint-order:stroke;filter:drop-shadow(0 2px 4px rgba(24,25,28,.34))}
  .map-svg .m-pin-dot{fill:#FFFFFF}
  .map-svg .m-pulse{fill:var(--map-pin);opacity:.26;transform-origin:190px 72px;
    animation:pulse 2.4s ease-out infinite}
  .map-credit{position:absolute;right:8px;bottom:6px;font-size:9px;line-height:1;
    color:#5A5A5A;letter-spacing:.02em;text-shadow:0 0 3px #FFF,0 0 3px #FFF,0 0 2px #FFF;
    pointer-events:none}
  @keyframes pulse{0%{transform:scale(.5);opacity:.35}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
  .map-tap{
    position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);
    padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.86);
    color:#2C2A33;font-size:11.5px;font-weight:600;letter-spacing:.03em;
    backdrop-filter:blur(6px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  body[data-theme="c"] .map-tap{background:rgba(11,21,51,.74);color:#C7D0EA}
  .map-cta{
    position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:999px;background:var(--pill-bg);color:var(--pill-fg);
    font-size:13px;font-weight:700;letter-spacing:.02em;
    border:1.5px solid var(--pill-border);box-shadow:0 6px 16px rgba(0,0,0,.18);
  }
  .map-cta svg{width:13px;height:13px;flex:0 0 13px}
  .map-alt{
    width:100%;text-align:center;font-size:12px;color:var(--sub);
    margin-top:-8px;letter-spacing:.02em;
  }
  .map-alt a{color:var(--sub);text-decoration:underline;text-underline-offset:3px}
  .map-alt .sep{opacity:.45;margin:0 5px}

  /* ---------- 背景音乐按钮 ---------- */
  /* 固定定位、但横向对齐到 420px 内容栏，窄屏时贴右边 */
  .music-dock{position:fixed;left:0;right:0;bottom:0;z-index:70;
    display:flex;justify-content:center;pointer-events:none}
  .music-dock .inner{position:relative;width:100%;max-width:420px;height:0}
  .music{position:absolute;right:14px;bottom:16px;pointer-events:auto;
    width:38px;height:38px;padding:0;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);color:var(--primary);
    box-shadow:0 6px 18px rgba(0,0,0,.13);
    transition:transform .18s ease,opacity .25s ease,color .25s ease;
    -webkit-tap-highlight-color:transparent}
  .music:active{transform:scale(.9)}
  .music svg{width:19px;height:19px}
  .music .disc{display:flex;align-items:center;justify-content:center}
  .music.on .disc{animation:spin 5.5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 关闭态：只把音符调暗，不叠斜线——38px 的尺寸下叠斜线会把音符压糊，
     状态改成靠「变淡 / 高亮+旋转」区分，音符本身始终完整可辨 */
  .music:not(.on){color:var(--sub);opacity:.62}
  /* 首次进页面还没响时轻微呼吸，提示可以点；一旦交互过就撤掉，不再打扰 */
  .music.hint .disc{animation:hintPulse 2s ease-in-out infinite}
  @keyframes hintPulse{
    0%,100%{transform:scale(1);opacity:.72}
    50%{transform:scale(1.18);opacity:1}
  }
  body[data-theme="c"] .music{background:#141C38;border-color:rgba(95,212,240,.32);
    color:var(--accent)}
  body[data-theme="c"] .music:not(.on){color:#8A96BC}
  @media (prefers-reduced-motion:reduce){
    .music.on .disc{animation:none}
    .music.hint{animation:none}
  }

  /* ---------- 落款 ---------- */
  .footer{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px;
    margin-top:2px;font-size:13.5px;color:var(--sub);letter-spacing:.06em}
  .countdown{
    display:inline-flex;align-items:baseline;gap:5px;padding:7px 16px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    font-size:12.5px;color:var(--sub);letter-spacing:.02em;
  }
  body[data-theme="b"] .countdown{background:#fff}
  .countdown b{font-size:18px;color:var(--primary);font-weight:800;letter-spacing:0}

  /* ---------- 对比版切换按钮（定稿版不输出） ---------- */
  .style-switch{position:fixed;right:12px;bottom:14px;z-index:99;display:flex;gap:7px}
  .style-switch button{
    width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.14);
    background:#fff;color:#333;font-size:12.5px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:.85;
    display:flex;align-items:center;justify-content:center;
  }
  .style-switch button.on{opacity:1;border-color:#111;background:#111;color:#fff}
</style>
</head>

<script>
  (function () {
    var a = document.getElementById('bgm');
    var btn = document.getElementById('musicBtn');
    if (!a || !btn) return;

    var want = true;
    try { if (sessionStorage.getItem('bgmOff') === '1') want = false; } catch (e) {}

    function clearHint() { btn.classList.remove('hint'); }

    function mark(on) {
      btn.classList.toggle('on', !!on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.setAttribute('aria-label', on ? '关闭背景音乐' : '播放背景音乐');
      if (on) clearHint();
    }

    function attempt() {
      if (!want) return;
      var p = a.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function () { mark(false); });   // 被自动播放策略拦下：保持「关闭」态，等用户点
      }
    }

    a.addEventListener('playing', function () { mark(true); });
    a.addEventListener('pause', function () { mark(false); });

    /* 微信内置浏览器默认禁止自动播放，桥接就绪后媒体才被放行，
       这是微信里自动播放成功率最高的一次尝试（iOS 尤其依赖它） */
    function onBridge() { if (want) attempt(); }
    if (typeof WeixinJSBridge !== 'undefined') onBridge();
    document.addEventListener('WeixinJSBridgeReady', onBridge, false);

    /* 其他浏览器：首次触摸或点击时补一次 */
    function firstTouch() {
      document.removeEventListener('touchstart', firstTouch);
      document.removeEventListener('click', firstTouch);
      clearHint();
      if (want && a.paused) attempt();
    }
    document.addEventListener('touchstart', firstTouch, { passive: true });
    document.addEventListener('click', firstTouch);

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();          // 别把这一次点击再喂给 firstTouch
      clearHint();
      if (a.paused) {
        want = true;
        try { sessionStorage.removeItem('bgmOff'); } catch (err) {}
        attempt();
      } else {
        want = false;
        try { sessionStorage.setItem('bgmOff', '1'); } catch (err) {}
        a.pause();
      }
    });

    mark(false);
    if (!want) a.setAttribute('preload', 'none');
    attempt();
    /* 呼吸提示最多闪 9 秒；真播放起来或用户碰过页面就立刻撤掉 */
    btn.classList.add('hint');
    window.setTimeout(clearHint, 9000);
  })();

</script>

<script>
  (function () {
    /* iPhone / iPad 上换用 Apple 地图，精确落到已核验的「徐北村」地点页；
       Android 等机型没有 Apple 地图，继续走高德。 */
    var _mc = document.getElementById('mapCard');
    if (_mc) {
      var _ua = navigator.userAgent || '';
      var _ios = /iPhone|iPad|iPod/.test(_ua) ||
                 (/Macintosh/.test(_ua) && 'ontouchend' in document);
      var _apple = _mc.getAttribute('data-apple');
      if (_ios && _apple) _mc.setAttribute('href', _apple);
    }
    var t = new Date(2026, 9, 3, 0, 0, 0);
    var d = Math.ceil((t - new Date()) / 86400000);
    document.getElementById('days').textContent = d > 0 ? d : (d === 0 ? '就在今天' : '已圆满');
  })();
</script>
